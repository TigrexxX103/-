<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>认领一块地 · 小程序预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 45%, #e0f2f1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 24px 16px;
    }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .phone {
      width: 375px; height: 760px; max-height: 92vh;
      background: #0f0f10; border-radius: 46px; padding: 12px;
      box-shadow: 0 30px 70px rgba(0,0,0,.28), 0 0 0 2px #1c1c1e, inset 0 0 0 1px rgba(255,255,255,.06);
      position: relative;
    }
    .notch {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 26px; background: #0f0f10; border-radius: 0 0 18px 18px; z-index: 5;
    }
    .screen { width: 100%; height: 100%; background: #fff; border-radius: 34px; overflow: hidden; position: relative; }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    .caption { color: #5a6b5a; font-size: 14px; letter-spacing: .5px; text-align: center; }
    .caption b { color: #2e7d32; }
    .hint { color: #8a9a8a; font-size: 12px; text-align: center; margin-top: -6px; }
    @media (max-width: 480px) {
      body { padding: 0; background: #fff; }
      .stage { width: 100%; height: 100vh; gap: 0; }
      .phone { width: 100%; height: 100vh; max-height: none; border-radius: 0; padding: 0; box-shadow: none; background: #fff; }
      .screen { border-radius: 0; }
      .notch, .caption, .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <iframe src="app.html" title="认领一块地小程序" allow="clipboard-read; clipboard-write"></iframe>
      </div>
    </div>
    <div class="caption"><b>认领一块地</b> · 微信小程序 H5 预览</div>
    <div class="hint">在手机上打开将自动全屏显示</div>
  </div>
</body>
</html>
